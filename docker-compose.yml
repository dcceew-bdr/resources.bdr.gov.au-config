services:
  fuseki:
    profiles: ["container"]
    build:
      context: fuseki
      dockerfile: Dockerfile
      args:
        FUSEKI_VERSION: ${FUSEKI_VERSION:-6.2.0-0}
    image: bdr-resources-fuseki:${FUSEKI_VERSION:-6.2.0-0}
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-${SPARQL_PASSWORD:?Set FUSEKI_ADMIN_PASSWORD in docker/.env}}
      REFDATA_PASSWORD: ${REFDATA_PASSWORD:-${SPARQL_PASSWORD:?Set REFDATA_PASSWORD in docker/.env}}
      JAVA_OPTS: ${FUSEKI_JAVA_OPTS:--Xms1g -Xmx2g}
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  prez:
    profiles: ["container"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PREZ_VERSION: ${PREZ_VERSION:-4.23.7}
    image: bdr-resources-prez:${PREZ_VERSION:-4.23.7}
    environment:
      SPARQL_REPO_TYPE: remote
      SPARQL_ENDPOINT: http://fuseki:3030/refdata/sparql
      SPARQL_USERNAME: refdata
      SPARQL_PASSWORD: ${REFDATA_PASSWORD:-${SPARQL_PASSWORD:?Set REFDATA_PASSWORD in docker/.env}}
      ENABLE_SPARQL_ENDPOINT: "true"
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      # Prez uses this hierarchy when generating internal links for listings.
      # Keep it aligned with prez/config/endpoints/data_endpoints_default.
      ENDPOINT_STRUCTURE: '["catalogues", "collections", "items"]'
    ports:
      - "8000:8000"
    depends_on:
      fuseki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://prez:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  prez-ui:
    profiles: ["container"]
    build:
      context: prez-ui
      dockerfile: Dockerfile
      args:
        PREZ_UI_VERSION: ${PREZ_UI_VERSION:-4.3.3}
        NUXT_PUBLIC_PREZ_API_ENDPOINT: http://localhost:3000/api
    environment:
      PREZ_UPSTREAM: http://prez:8000
    image: bdr-resources-prez-ui:${PREZ_UI_VERSION:-4.3.3}
    ports:
      - "3000:3000"
    depends_on:
      prez:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://prez-ui:3000/"]
      interval: 5s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  prez-ui-functions:
    profiles: ["functions"]
    build:
      context: prez-ui
      dockerfile: Dockerfile
      args:
        PREZ_UI_VERSION: ${PREZ_UI_VERSION:-4.3.3}
        NUXT_PUBLIC_PREZ_API_ENDPOINT: http://localhost:3000/api
    environment:
      PREZ_UPSTREAM: http://host.docker.internal:7071
    image: bdr-resources-prez-ui:${PREZ_UI_VERSION:-4.3.3}-functions
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://prez-ui-functions:3000/"]
      interval: 5s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  fuseki-data:

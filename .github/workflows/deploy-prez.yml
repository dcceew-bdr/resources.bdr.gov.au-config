name: Deploy Prez Function App

on:
  push:
    branches: [main]
    paths:
      - "prez/**"
      - ".github/workflows/deploy-prez.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prez-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: prez/uv.lock

      - name: Export locked production dependencies
        # Azure's remote pip build cannot verify hashes for Git dependencies.
        # Prez itself pins rdf2geojson with its oxigraph extra; omit uv's second
        # direct-URL form so pip does not treat tag and commit URLs as a conflict.
        run: uv export --project prez --locked --no-dev --no-hashes --no-emit-package rdf2geojson --output-file prez/requirements.txt

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Prez to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: prez
          remote-build: true
          respect-funcignore: true
